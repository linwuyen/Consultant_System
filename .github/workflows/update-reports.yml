name: Legacy fallback refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh legacy JSON snapshot
        run: python scripts/update_reports.py
      - name: Audit four-firm legacy coverage
        continue-on-error: true
        run: python scripts/audit_coverage.py
      - name: Commit changed fallback snapshot
        run: |
          if git diff --quiet -- data/reports.json data/reports.csv; then
            echo "No fallback snapshot changes"
            exit 0
          fi
          git config user.name "consultant-system-bot"
          git config user.email "consultant-system-bot@users.noreply.github.com"
          git add data/reports.json data/reports.csv
          git commit -m "chore: refresh legacy fallback snapshot"
          git push
