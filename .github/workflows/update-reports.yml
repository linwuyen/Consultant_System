name: Update consultant database

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-reports.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Taipei

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: consultant-db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh metadata database
        run: python scripts/update_reports.py
      - name: Audit four-firm coverage
        continue-on-error: true
        run: python scripts/audit_coverage.py
      - name: Commit changed database
        run: |
          if git diff --quiet -- data/reports.json data/reports.csv; then
            echo "No database changes"
          else
            git config user.name "consultant-system-bot"
            git config user.email "consultant-system-bot@users.noreply.github.com"
            git add data/reports.json data/reports.csv
            git commit -m "chore: refresh consultant database"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp data/reports.json data/reports.csv _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
