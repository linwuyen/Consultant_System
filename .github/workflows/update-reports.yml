name: Update SQLite research database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Taipei
  push:
    branches: [main]
    paths:
      - "scripts/update_reports.py"
      - "scripts/build_sqlite.py"
      - "scripts/audit_coverage.py"
      - "config/sources.json"
      - "requirements.txt"
      - ".github/workflows/update-reports.yml"

permissions:
  contents: write

concurrency:
  group: sqlite-research-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh research metadata
        run: python scripts/update_reports.py

      - name: Audit four-firm coverage
        continue-on-error: true
        run: python scripts/audit_coverage.py

      - name: Build SQLite database
        run: python scripts/build_sqlite.py

      - name: Verify SQLite database
        run: |
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect('data/consultant.db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'reports', 'topics', 'report_topics', 'sources', 'meta'}
          assert required <= tables, (required, tables)
          total = con.execute('SELECT COUNT(*) FROM reports').fetchone()[0]
          companies = dict(con.execute('SELECT company, COUNT(*) FROM reports GROUP BY company'))
          print('SQLite integrity PASS')
          print('reports =', total)
          print('companies =', companies)
          con.close()
          PY

      - name: Commit refreshed database
        shell: bash
        run: |
          if git diff --quiet -- data/reports.json data/reports.csv data/consultant.db; then
            echo "No database changes"
            exit 0
          fi
          git config user.name "consultant-system-bot"
          git config user.email "consultant-system-bot@users.noreply.github.com"
          git add data/reports.json data/reports.csv data/consultant.db
          git commit -m "chore: refresh SQLite research database"
          git pull --rebase origin main
          git push origin HEAD:main
