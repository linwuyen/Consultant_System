name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**","data/**","scripts/build_sqlite.py","scripts/build_manifest.py","scripts/common.py","config/sources.json","package.json",".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install
      - name: Build SQLite and manifest
        run: |
          python scripts/build_sqlite.py
          python scripts/build_manifest.py
      - name: Validate JavaScript
        run: npm run check:syntax
      - uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          mkdir -p _site/data _site/vendor
          cp -R site/. _site/
          cp data/consultant.db data/reports.json data/reports.csv data/manifest.json _site/data/
          if [ -f data/source_health.json ]; then cp data/source_health.json _site/data/; fi
          cp node_modules/sql.js/dist/sql-wasm.js _site/vendor/
          cp node_modules/sql.js/dist/sql-wasm.wasm _site/vendor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
