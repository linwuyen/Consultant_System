name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/**"
      - "config/**"
      - "scripts/generate_worker_config.mjs"
      - "scripts/cloudflare-ci.sh"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy, migrate, refresh, audit and snapshot
        shell: bash
        run: bash scripts/cloudflare-ci.sh
