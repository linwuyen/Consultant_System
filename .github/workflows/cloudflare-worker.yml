name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional. If this secret is absent, the workflow resolves it from the
      # token when possible; Wrangler can also infer it for a single account.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare API token is configured."

      - name: Resolve Cloudflare account ID
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Using CLOUDFLARE_ACCOUNT_ID already configured in GitHub Secrets."
            exit 0
          fi

          echo "No account ID secret configured; attempting discovery from the API token..."
          set +e
          HTTP_BODY=$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")
          CURL_STATUS=$?
          set -e

          if [[ "$CURL_STATUS" -ne 0 || -z "$HTTP_BODY" ]]; then
            echo "::warning::Account discovery API was unavailable. Wrangler will infer the account from the token."
            exit 0
          fi

          export HTTP_BODY
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(os.environ["HTTP_BODY"])
          accounts = payload.get("result") or []
          if len(accounts) == 1:
              account = accounts[0]
              account_id = account.get("id", "")
              account_name = account.get("name", "Cloudflare account")
              if account_id:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                      f.write(f"CLOUDFLARE_ACCOUNT_ID={account_id}\n")
                  print(f"Resolved Cloudflare account: {account_name}")
          elif len(accounts) == 0:
              print("::warning::No accounts returned by the API. Wrangler will attempt account inference.")
          else:
              names = ", ".join(str(a.get("name", "unnamed")) for a in accounts)
              print(f"::warning::Multiple Cloudflare accounts are accessible ({names}). Wrangler will select/infer according to the token context.")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Show Wrangler identity
        run: npx wrangler whoami

      - name: Validate Worker
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker and auto-provision D1
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

          WORKER_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev[^ ]*' /tmp/wrangler-deploy.log | tail -1 | sed 's/[[:punct:]]$//' || true)
          if [[ -n "$WORKER_URL" ]]; then
            echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
            echo "Deployed URL: $WORKER_URL"
          else
            echo "No workers.dev URL parsed from Wrangler output; deploy itself completed successfully."
          fi

      - name: Verify deployed API
        if: ${{ steps.deploy.outputs.worker_url != '' }}
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}/api/health"
          echo "Checking $URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "Cloudflare Worker health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Worker deployed but /api/health did not become healthy."
          exit 1
