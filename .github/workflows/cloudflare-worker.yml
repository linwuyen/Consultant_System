name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/**"
      - "config/**"
      - "scripts/generate_worker_config.mjs"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-worker.yml"

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare API token is configured."

      - name: Install dependencies
        run: npm install

      - name: Resolve Cloudflare account ID with Wrangler
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Using CLOUDFLARE_ACCOUNT_ID from GitHub Secrets."
            exit 0
          fi

          echo "No account ID secret found; resolving from authenticated Wrangler identity..."
          set +e
          npx wrangler whoami --json > /tmp/whoami.json 2> /tmp/whoami.err
          WHOAMI_STATUS=$?
          set -e

          if [[ "$WHOAMI_STATUS" -ne 0 ]]; then
            cat /tmp/whoami.err || true
            echo "::error::Wrangler could not read account membership from this API token."
            echo "The token must be scoped to the target account and include the standard Edit Cloudflare Workers template permissions."
            exit 1
          fi

          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          data = json.loads(Path('/tmp/whoami.json').read_text(encoding='utf-8'))
          accounts = data.get('accounts') or []
          candidates = []

          if isinstance(accounts, dict):
              accounts = [accounts]

          for account in accounts:
              if not isinstance(account, dict):
                  continue
              account_id = account.get('id') or account.get('account_id') or account.get('accountId')
              if isinstance(account_id, str) and re.fullmatch(r'[0-9a-fA-F]{32}', account_id):
                  candidates.append((account_id.lower(), str(account.get('name') or 'Cloudflare account')))

          if not candidates:
              def walk(value, path=()):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          new_path = path + (str(key).lower(),)
                          if isinstance(child, str) and re.fullmatch(r'[0-9a-fA-F]{32}', child) and any('account' in p for p in new_path):
                              candidates.append((child.lower(), '/'.join(new_path)))
                          walk(child, new_path)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child, path)
              walk(data)

          unique = []
          seen = set()
          for account_id, name in candidates:
              if account_id not in seen:
                  seen.add(account_id)
                  unique.append((account_id, name))

          if len(unique) == 0:
              print('::error::Authenticated, but Wrangler returned no usable account ID.')
              print('whoami keys:', ', '.join(sorted(data.keys())))
              sys.exit(1)
          if len(unique) > 1:
              print('::error::Multiple Cloudflare accounts are available; refusing to deploy to an arbitrary account.')
              for account_id, name in unique:
                  print(f'  {name}: {account_id}')
              sys.exit(1)

          account_id, name = unique[0]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'CLOUDFLARE_ACCOUNT_ID={account_id}\n')
          print(f'Resolved Cloudflare account: {name} ({account_id})')
          PY

      - name: Generate canonical Worker config
        run: npm run generate:config

      - name: Syntax checks
        run: npm run check:syntax

      - name: Show Wrangler identity
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Provision resources and deploy Worker
        id: deploy
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.jsonl
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

          WORKER_URL=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/wrangler-output.jsonl')
          target = ''
          if path.exists():
              for raw in path.read_text(encoding='utf-8').splitlines():
                  try:
                      item = json.loads(raw)
                  except Exception:
                      continue
                  if item.get('type') == 'deploy':
                      targets = item.get('targets') or []
                      for value in targets:
                          if isinstance(value, str) and value.startswith('https://'):
                              target = value.rstrip('/')
                              break
          print(target)
          PY
          )

          if [[ -z "$WORKER_URL" ]]; then
            WORKER_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev[^ ]*' /tmp/wrangler-deploy.log | tail -1 | sed 's/[[:punct:]]$//' || true)
          fi
          if [[ -z "$WORKER_URL" ]]; then
            echo "::error::Deployment completed but Worker URL could not be determined."
            cat /tmp/wrangler-deploy.log
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "Deployed URL: $WORKER_URL"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Install rotating refresh secret
        shell: bash
        run: |
          ADMIN_TOKEN=$(openssl rand -hex 32)
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Verify D1 health
        shell: bash
        run: |
          URL="$WORKER_URL/api/health"
          for attempt in 1 2 3 4 5; do
            BODY=$(curl --fail --silent --show-error "$URL" || true)
            if [[ -n "$BODY" ]]; then
              export BODY
              if python - <<'PY'
          import json, os, sys
          data = json.loads(os.environ['BODY'])
          if data.get('ok') is True and str(data.get('schema_version')) == '2':
              print('Health PASS:', json.dumps(data, ensure_ascii=False))
              sys.exit(0)
          print('Health not ready:', data)
          sys.exit(1)
          PY
              then
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::D1 health check failed or schema_version is not 2."
          exit 1

      - name: Run production refresh
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 240 \
            -X POST "$WORKER_URL/api/refresh" \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -o /tmp/refresh.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/refresh.json', encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Audit four-firm D1 coverage
        shell: bash
        run: |
          curl --fail --silent --show-error "$WORKER_URL/api/coverage" -o /tmp/coverage.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/coverage.json', encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          failures = [x['company'] for x in data.get('companies', []) if x.get('status') == 'FAIL']
          partial = [x['company'] for x in data.get('companies', []) if x.get('status') == 'PARTIAL']
          if failures:
              print('::warning::Coverage FAIL will be enforced after snapshot sync: ' + ', '.join(failures))
          if partial:
              print('::warning::Coverage PARTIAL: ' + ', '.join(partial))
          PY

      - name: Sync D1 fallback snapshots
        shell: bash
        run: |
          mkdir -p data
          curl --fail --silent --show-error "$WORKER_URL/api/export.json" -o data/reports.json
          curl --fail --silent --show-error "$WORKER_URL/api/export.csv" -o data/reports.csv

      - name: Record production URL in README
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          url = os.environ['WORKER_URL']
          block = f"<!-- PRODUCTION_URL_START -->\n**Production:** {url}\n\n**GitHub Pages fallback:** https://linwuyen.github.io/Consultant_System/\n<!-- PRODUCTION_URL_END -->"
          pattern = r'<!-- PRODUCTION_URL_START -->[\s\S]*?<!-- PRODUCTION_URL_END -->'
          if re.search(pattern, text):
              text = re.sub(pattern, block, text)
          else:
              marker = '## Website\n'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + block + '\n', 1)
              else:
                  text = block + '\n\n' + text
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/reports.json data/reports.csv README.md; then
            echo "No snapshot changes"
          else
            git config user.name "consultant-system-bot"
            git config user.email "consultant-system-bot@users.noreply.github.com"
            git add data/reports.json data/reports.csv README.md
            git commit -m "chore: sync D1 production snapshot"
            git push
          fi

      - name: Enforce final coverage gate
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open('/tmp/coverage.json', encoding='utf-8'))
          failures = [x['company'] for x in data.get('companies', []) if x.get('status') == 'FAIL']
          if failures:
              print('::error::Coverage FAIL: ' + ', '.join(failures))
              sys.exit(1)
          print('Coverage gate PASS/PARTIAL: no company is at FAIL.')
          PY
